<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Tolu – Padho, Bolo, Seekho. Phonics, words, grammar, stories and Hindi varnamala for kids aged 5 to 10.">
<meta name="theme-color" content="#3fa86b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tolu">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Tolu</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+2:wght@500;600;800&display=swap">
<style>
/* Layout: phone-first app — sticky Tolu header, island map home, island → activity cards → play panel */
:root{
  --sky:#e8f4fb; --card:#ffffff; --ink:#23324a; --soft:#5d6f86; --line:#cfe2ee; --tile:#eef6fb; --mint-2:#d9f5ef;
  --leaf:#3fa86b; --leaf-2:#d7f2e1; --sun:#ffc83d; --sun-2:#fff3cc; --berry:#ef5a7a; --berry-2:#fde2e8;
  --blue:#3b8fd9; --blue-2:#dcecfb; --grape:#8a63d2; --grape-2:#ece4fb; --bird:#ff9f43; --bird-2:#ffd8a8;
  --display:"Baloo 2","Comic Sans MS",system-ui,sans-serif;
  --read:"Andika","Baloo 2","Century Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --sky:#14202e; --card:#1d2b3c; --ink:#eef4fa; --soft:#a9b9cb; --line:#2f4258; --tile:#24364a; --mint-2:#17403a;
  --leaf:#5cc98a; --leaf-2:#1f3d2e; --sun:#ffd166; --sun-2:#3a3320; --berry:#ff7d97; --berry-2:#45242d;
  --blue:#6cb2f0; --blue-2:#1d3550; --grape:#b195f0; --grape-2:#33284a; --bird:#ffad5c; --bird-2:#5a3e24; color-scheme:dark}}
:root[data-theme="dark"]{
  --sky:#14202e; --card:#1d2b3c; --ink:#eef4fa; --soft:#a9b9cb; --line:#2f4258; --tile:#24364a; --mint-2:#17403a;
  --leaf:#5cc98a; --leaf-2:#1f3d2e; --sun:#ffd166; --sun-2:#3a3320; --berry:#ff7d97; --berry-2:#45242d;
  --blue:#6cb2f0; --blue-2:#1d3550; --grape:#b195f0; --grape-2:#33284a; --bird:#ffad5c; --bird-2:#5a3e24; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--sky);color:var(--ink);font-family:var(--read);font-size:18px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--sky)}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--leaf);outline-offset:3px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.1}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--sky);padding-block:10px 6px;display:flex;align-items:flex-end;gap:8px}
.home{width:46px;height:46px;border-radius:14px;background:var(--card);font-size:24px;box-shadow:0 3px 0 var(--line);align-self:center;flex:none}
.bird{width:76px;flex:none}
.bird svg{width:100%;height:auto;display:block;overflow:visible}
.bubble{position:relative;background:var(--card);border-radius:18px;padding:9px 14px;flex:1;min-width:0;font-family:var(--display);
  font-size:clamp(16px,4vw,21px);line-height:1.2;box-shadow:0 3px 0 var(--line);margin-bottom:18px}
.bubble::after{content:"";position:absolute;left:-11px;bottom:14px;border:8px solid transparent;border-right:12px solid var(--card)}
.stars{font-family:var(--display);background:var(--sun-2);border-radius:999px;padding:4px 10px;font-size:18px;align-self:center;white-space:nowrap}
#body{animation:bob 2.6s ease-in-out infinite}
.eye-lid{animation:blink 4s infinite;transform-origin:center;transform-box:fill-box}
#mouth{transform-origin:center;transform-box:fill-box}
.talking #mouth{animation:talk .22s infinite alternate}
.wing{transform-box:fill-box} #wingL{transform-origin:right top} #wingR{transform-origin:left top}
.cheer #wingL{animation:flapL .25s 6 alternate} .cheer #wingR{animation:flapR .25s 6 alternate}
.cheer #body{animation:hop .5s 3} .sad #body{animation:tilt .6s 2}
@keyframes bob{50%{transform:translateY(-4px)}}
@keyframes blink{0%,92%,100%{transform:scaleY(0)}95%{transform:scaleY(1)}}
@keyframes talk{to{transform:scaleY(2.4)}}
@keyframes flapL{to{transform:rotate(-35deg)}} @keyframes flapR{to{transform:rotate(35deg)}}
@keyframes hop{50%{transform:translateY(-16px)}} @keyframes tilt{25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}

/* home */
.welcome{background:var(--card);border-radius:28px;padding:20px;box-shadow:0 4px 0 var(--line);display:grid;gap:12px}
.welcome h1{font-size:clamp(30px,8vw,46px)}
.welcome p{margin:0;color:var(--soft)}
.tally{display:flex;flex-wrap:wrap;gap:8px}
.tally span{background:var(--tile);border-radius:999px;padding:4px 12px;font-family:var(--display);font-size:16px}
.plan{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.plan button{background:var(--sun-2);border-radius:18px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:var(--display);font-size:15px;line-height:1.1}
.plan button span{font-size:30px}
.plan button.ok{background:var(--leaf-2)}
.label{font-family:var(--display);font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--soft)}
.islands{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.island{border-radius:28px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:6px;box-shadow:0 4px 0 var(--line);position:relative;overflow:hidden;min-height:150px}
.island .art{font-size:40px;letter-spacing:-6px;line-height:1}
.island .art span{display:inline-block;animation:float 3s ease-in-out infinite}
.island .art span:nth-child(2){animation-delay:.5s} .island .art span:nth-child(3){animation-delay:1s}
.island h2{font-size:24px}
.island p{margin:0;font-size:15px;color:var(--soft);line-height:1.3}
.island .age{position:absolute;top:12px;right:12px;font-family:var(--display);font-size:13px;background:var(--card);border-radius:999px;padding:2px 9px}
.island .bar{height:8px;border-radius:9px;background:var(--card);overflow:hidden;margin-top:auto}
.island .bar i{display:block;height:100%;background:var(--ink);opacity:.55;border-radius:9px}
.t-berry{background:var(--berry-2)} .t-sun{background:var(--sun-2)} .t-leaf{background:var(--leaf-2)}
.t-blue{background:var(--blue-2)} .t-grape{background:var(--grape-2)} .t-bird{background:var(--bird-2)} .t-tile{background:var(--tile)}
@keyframes float{50%{transform:translateY(-6px)}}
details.parents{background:var(--card);border-radius:22px;padding:14px 18px;box-shadow:0 3px 0 var(--line)}
details.parents summary{font-family:var(--display);font-size:18px;cursor:pointer}
.parents table{width:100%;border-collapse:collapse;font-size:15px;margin-top:10px}
.parents td{padding:6px 4px;border-top:1px solid var(--line);vertical-align:top}
.parents td:first-child{font-family:var(--display);white-space:nowrap;padding-right:10px}

/* island page */
.ihead{border-radius:28px;padding:18px;display:flex;gap:12px;align-items:center}
.ihead .art{font-size:46px;line-height:1}
.ihead h1{font-size:clamp(26px,7vw,38px)}
.ihead p{margin:4px 0 0;color:var(--soft);font-size:16px}
.acts{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.act{background:var(--card);border-radius:22px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px;box-shadow:0 3px 0 var(--line);position:relative}
.act .e{font-size:38px;line-height:1}
.act b{font-family:var(--display);font-size:19px;line-height:1.1}
.act small{font-family:var(--display);font-size:13px;color:var(--soft)}
.act .tick{position:absolute;top:10px;right:12px;font-size:20px}
.back{align-self:flex-start;font-family:var(--display);background:var(--card);border-radius:999px;padding:6px 14px;box-shadow:0 3px 0 var(--line);font-size:16px}

/* play panel */
.panel{background:var(--card);border-radius:28px;padding:18px;box-shadow:0 4px 0 var(--line);display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.chips{display:flex;gap:8px;overflow-x:auto;width:100%;padding-bottom:10px;position:relative;scroll-behavior:smooth;scrollbar-width:thin;scrollbar-color:var(--sun) var(--tile)}
.chips::-webkit-scrollbar{height:10px}.chips::-webkit-scrollbar-track{background:var(--tile);border-radius:10px}.chips::-webkit-scrollbar-thumb{background:var(--sun);border-radius:10px}
.chipwrap{display:flex;align-items:center;gap:6px;width:100%}
.chipwrap .chips{flex:1;min-width:0}
.cnav{flex:none;width:38px;height:38px;border-radius:50%;background:var(--sun);color:#3b2a00;font-size:16px;box-shadow:0 3px 0 var(--line);margin-bottom:10px}
.cnav:disabled{opacity:.3;cursor:default}
.chip-btn{flex:none;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:4px 14px;font-family:var(--display);font-size:16px}
.chip-btn[aria-pressed="true"]{border-color:var(--sun);background:var(--sun-2)}
.pic{font-size:clamp(76px,22vw,124px);line-height:1;user-select:none;cursor:pointer}
.pop{animation:pop .45s} @keyframes pop{40%{transform:scale(1.18) rotate(-4deg)}}
.word{font-size:clamp(40px,11vw,64px);font-weight:700;letter-spacing:.04em;line-height:1}
.sent{color:var(--soft);font-size:20px;max-width:32ch}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.big{font-family:var(--display);font-size:18px;border-radius:999px;padding:9px 18px;background:var(--leaf-2);color:var(--ink);box-shadow:0 3px 0 var(--line)}
.big.go{background:var(--leaf);color:#fff} .big.sun{background:var(--sun);color:#3b2a00}
.big:active{transform:translateY(2px);box-shadow:none}
.nav{display:flex;justify-content:space-between;width:100%;align-items:center}
.round{width:52px;height:52px;border-radius:50%;background:var(--sun-2);font-size:24px}
.count{color:var(--soft);font-family:var(--display)}
.tip{font-size:16px;color:var(--soft);max-width:38ch}
.abc{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px;width:100%}
.key{background:var(--tile);border-radius:12px;font-size:22px;font-weight:700;padding:6px 0}
.key[aria-pressed="true"]{background:var(--berry);color:#fff}
.letter-big{font-size:clamp(66px,18vw,104px);font-weight:700;line-height:1;color:var(--berry)}
.examples{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.ex{background:var(--tile);border-radius:20px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:19px;font-weight:700}
.ex span{font-size:clamp(40px,12vw,60px);line-height:1}
.ex b,.hl{color:var(--berry)}
.builder{display:flex;align-items:center;gap:6px;font-size:clamp(52px,15vw,82px);font-weight:700;line-height:1}
.slot{min-width:1.1em;border-bottom:6px dashed var(--line);color:var(--berry);display:inline-block}
.slot.full{border-bottom-color:transparent}
.rime{color:var(--leaf)} .lit{animation:lit .5s} @keyframes lit{50%{transform:scale(1.25)}}
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tile{min-width:54px;height:54px;padding:0 12px;border-radius:14px;background:var(--berry-2);font-size:26px;font-weight:700;box-shadow:0 3px 0 var(--line)}
.tile.used{visibility:hidden}
.found{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.found span{background:var(--leaf-2);border-radius:999px;padding:4px 12px;font-size:19px;font-weight:700}
.syl{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chip{font-size:clamp(24px,7vw,38px);font-weight:700;padding:4px 14px;border-radius:16px;background:var(--berry-2);color:var(--ink)}
.chip.on{background:var(--berry);color:#fff;transform:scale(1.08)}
.choice.right,.opt.right{border-color:var(--leaf)!important;background:var(--leaf-2)!important}
.choice.wrong,.opt.wrong{animation:shake .4s;opacity:.45}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.choice{background:var(--tile);border-radius:22px;padding:10px 0;border:3px solid transparent;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:19px;font-weight:700}
.choice span{font-size:clamp(44px,13vw,70px);line-height:1}

/* quiz + lesson */
.qtop{display:flex;justify-content:space-between;align-items:center;width:100%}
.dots{display:flex;gap:5px} .dots i{width:10px;height:10px;border-radius:50%;background:var(--line)} .dots i.d{background:var(--leaf)}
.qpic{font-size:clamp(54px,16vw,90px);line-height:1.1;letter-spacing:4px}
.qtext{font-size:clamp(22px,6vw,32px);font-weight:700;line-height:1.3;max-width:24ch}
.qtext .gap{display:inline-block;min-width:2.6em;border-bottom:4px solid var(--berry);color:var(--berry)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;width:100%}
.opt{background:var(--tile);border:3px solid transparent;border-radius:20px;padding:12px 10px;font-size:clamp(19px,5vw,24px);font-weight:700;line-height:1.25}
.opt.long{font-size:clamp(17px,4.4vw,21px);text-align:left}
.result{font-size:clamp(28px,8vw,44px);font-family:var(--display)}
.lesson h2{font-size:clamp(26px,7vw,36px)}
.rule{background:var(--sun-2);border-radius:20px;padding:12px 16px;text-align:left;width:100%;display:grid;gap:6px}
.rule p{margin:0;font-size:19px;line-height:1.4}
.exgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;width:100%}

/* sentence */
.line{min-height:64px;width:100%;border-radius:18px;border:3px dashed var(--line);display:flex;flex-wrap:wrap;gap:8px;padding:8px;align-items:center;justify-content:center}
.line .tile{background:var(--leaf-2)}
.line.ok{border-style:solid;border-color:var(--leaf)}
.made{font-size:clamp(22px,6vw,30px);font-weight:700}
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
.col{display:flex;flex-direction:column;gap:6px}
.col h3{font-size:15px;color:var(--soft)}
.col button{background:var(--tile);border:3px solid transparent;border-radius:14px;padding:6px 4px;font-size:15px;font-weight:700;line-height:1.2}
.col button[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-2)}

/* scenes (story illustrations: fixed colours on purpose, they are pictures) */
.scene{position:relative;width:100%;aspect-ratio:16/9;max-width:100%;border-radius:22px;overflow:hidden;font-size:clamp(22px,6.5vw,44px)}
.it{position:absolute;transform:translate(-50%,-50%);line-height:1}
.it>span{display:inline-block}
.a-f>span{animation:float 3s ease-in-out infinite} .a-b>span{animation:hop 1.2s ease-in-out infinite}
.a-s>span{animation:sway 3s ease-in-out infinite;transform-origin:bottom center} .a-w>span{animation:wig 1s ease-in-out infinite}
.a-d>span{animation:drift 9s linear infinite}
@keyframes sway{50%{transform:rotate(6deg)}} @keyframes wig{50%{transform:rotate(-10deg)}}
@keyframes drift{0%{transform:translateX(-30px)}50%{transform:translateX(30px)}100%{transform:translateX(-30px)}}
.bg-park{background:linear-gradient(#bfe6ff 0 62%,#8fd17a 62%)}
.bg-road{background:linear-gradient(#cdeeff 0 58%,#8a98a6 58% 82%,#8fd17a 82%)}
.bg-zoo{background:linear-gradient(#c8f0ff 0 60%,#a6dc7c 60%)}
.bg-hot{background:linear-gradient(#ffe29a,#ffcf9e 62%,#e2bf86 62%)}
.bg-garden{background:linear-gradient(#e0f4ff 0 58%,#9ccf6e 58%)}
.bg-roof{background:linear-gradient(#8fd0ff,#d6f0ff 66%,#c9b3a0 66%)}
.bg-night{background:linear-gradient(#20335a,#3b4f7d 66%,#2c4a3a 66%)}
.bg-kitchen{background:linear-gradient(#fff1d6 0 68%,#d9a97a 68%)}
.bg-beach{background:linear-gradient(#bfe9ff 0 48%,#5cc3e8 48% 66%,#f5dc9a 66%)}
.bg-moon{background:linear-gradient(#141e3a,#2a3a6a 68%,#b9bfcc 68%)}
.bg-school{background:linear-gradient(#d6efff 0 62%,#e8d3a8 62%)}
.bg-bus{background:linear-gradient(#ffe9b0 0 58%,#8a98a6 58% 82%,#8fd17a 82%)}
.storytext{font-size:clamp(22px,5.6vw,28px);line-height:1.6;text-align:left;width:100%}
.storytext .w{cursor:pointer;border-radius:6px}
.storytext .w.g{border-bottom:3px dotted var(--grape);color:var(--grape);font-weight:700}
.storytext .sen.on{background:var(--sun-2)}
.storytext .w.tap{background:var(--berry-2)}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;width:100%}
.book{border-radius:22px;padding:0;overflow:hidden;text-align:left;background:var(--card);box-shadow:0 3px 0 var(--line);display:flex;flex-direction:column}
.book .scene{border-radius:0;font-size:28px}
.book div.info{padding:10px 14px 14px;display:grid;gap:2px}
.book b{font-family:var(--display);font-size:20px;line-height:1.1}
.book small{font-family:var(--display);color:var(--soft)}

/* write */
.trace-word{font-size:32px;letter-spacing:.12em;font-weight:700}
.trace-word span{opacity:.35} .trace-word span.now{opacity:1;color:var(--berry);text-decoration:underline 4px}
.pad{position:relative;width:100%;max-width:440px;aspect-ratio:4/3;border-radius:20px;overflow:hidden;background:#fffdf6;touch-action:none;border:2px solid var(--line)}
.pad canvas{position:absolute;inset:0;width:100%;height:100%}

/* stickers */
.stickers{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:10px;width:100%}
.stk{aspect-ratio:1;border-radius:18px;background:var(--tile);font-size:38px;display:grid;place-items:center}
.stk.lock{font-size:22px;opacity:.5}
.stk.new{animation:pop .6s 3}

.confetti{position:fixed;pointer-events:none;font-size:26px;z-index:20;animation:fly 1.1s ease-out forwards}
@keyframes fly{to{transform:translate(var(--x),var(--y)) rotate(320deg);opacity:0}}
.note{font-size:14px;color:var(--soft);text-align:center}
.bird{position:relative;padding:0;cursor:pointer}
.qbadge{position:absolute;right:-4px;top:0;width:26px;height:26px;border-radius:50%;background:var(--blue);color:#fff;font-family:var(--display);font-size:17px;line-height:26px;text-align:center;z-index:1;box-shadow:0 2px 0 var(--line);animation:float 2.4s ease-in-out infinite}
.t-mint{background:var(--mint-2)}
.modal{position:fixed;inset:0;z-index:30;background:rgba(20,30,45,.5);display:grid;place-items:center;padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.mbox{background:var(--card);border-radius:28px;padding:20px;max-width:480px;width:100%;display:grid;gap:14px;text-align:center;max-height:100%;overflow:auto;animation:pop .35s}
.mhead{font-family:var(--display);font-size:clamp(26px,7vw,34px)}
.mtext{font-size:20px;line-height:1.45;text-align:left;display:grid;gap:8px}
.mtext p{margin:0}
.grown{font-size:15px;color:var(--soft);background:var(--tile);border-radius:14px;padding:8px 12px;text-align:left;line-height:1.4}
.toggle{font-family:var(--display);font-size:15px;color:var(--soft)}
.sounds{position:relative;display:flex;gap:8px;justify-content:center;padding-top:36px;padding-bottom:36px;width:100%}
.snd{min-width:clamp(50px,14vw,76px);height:clamp(66px,18vw,92px);border-radius:18px;background:var(--blue-2);font-size:clamp(36px,10vw,58px);font-weight:700;display:inline-flex;align-items:center;justify-content:center;padding:0 10px;box-shadow:0 4px 0 var(--line);position:relative;color:var(--ink);transition:transform .15s}
.snd.v{background:var(--berry-2)}
.snd.dg::after{content:"";position:absolute;left:12px;right:12px;bottom:9px;height:4px;border-radius:4px;background:var(--grape)}
.snd.silent{background:var(--tile);color:var(--soft)}

function actMake(p,id,idx){

  const toTile=(w,i)=>i===0&&!/^(I|Siya|Raj|Riya)$/.test(w)?w.toLowerCase():w;
  const tiles=shuffle(words.map((w,i)=>({w:toTile(w,i),i})));let built=[],solved=false;
  p.innerHTML=`${chips(lvls.map((_,i)=>[String(i),LVN[i]]),String(lv),"ml")}
   <div class="pic">${em}</div><div class="tip" style="font-size:19px">Tap the words in the right order to make a sentence.</div>

   <button class="big go pulse" id="mnext" hidden>Next sentence ▶</button>

  const line=$("#line");
  function draw(){line.innerHTML=built.map(j=>`<span class="tile">${tiles[j].w}</span>`).join("");
    p.querySelectorAll("#tiles .tile").forEach(b=>b.classList.toggle("used",built.includes(+b.dataset.j)))}
  p.querySelectorAll("#tiles .tile").forEach(b=>b.onclick=async()=>{if(solved)return;const j=+b.dataset.j;if(built.includes(j))return;built.push(j);draw();sfx.pop();say(tiles[j].w,.75,false);
    if(built.length===words.length){const got=built.map(j=>tiles[j].w).join(" "),want=words.map(toTile).join(" ");
      if(got===want){solved=true;line.classList.add("ok");line.innerHTML=`<span class="made">${sent}</span>`;sfx.ding();sparkle(line);addStar();mood("cheer");confetti();
        S.made=(S.made||0)+1;if(S.made>=5)markDone(id);$("#mnext").hidden=false;
        say(`${sent} ${praise()} Look, a capital letter at the start and ${end==="?"?"a question mark":"a full stop"} at the end!`,.8)}
      else{sfx.boing();mood("sad");say("Almost! Let's try that again.",.85);await wait(900);built=[];draw()}}});
  $("#undo").onclick=()=>{if(!solved){built.pop();draw()}};
  $("#hint").onclick=()=>{say(`It starts with: ${words[0]}.`,.8)};

  $("#mnext").onclick=()=>{hush();actMake(p,id,(idx+1)%pool.length)};
  p.querySelectorAll("[data-ml]").forEach(b=>b.onclick=()=>{hush();S.lvl.make=+b.dataset.ml;save();actMake(p,id,0)});
  bubble("Make a sentence! What is in the picture?");
}

  const raw=arr[S.wi],show=S.wlist==="letters"?(S.lower?raw:raw.toUpperCase()):raw,units=S.wlist==="hindi"?[show]:[...show];if(S.li>=units.length)S.li=0;

  ink.onpointermove=e=>{if(!drawing)return;const q=pt(e);ic.beginPath();ic.moveTo(...last);ic.lineTo(...q);ic.stroke();len+=Math.hypot(q[0]-last[0],q[1]-last[1]);last=q};

function wordHelper(word,meaning){

  openModal(`<div class="mhead">🧩 ${word}</div>

   <div class="row">${canBlend?'<button class="big sun" id="wSo">🧩 Sound it out</button>':`<button class="big sun" id="wSlow">🐢 Slow-mo</button>`}<button class="big go" id="wSay">🔊 Say it</button><button class="big" id="wOk">👍 Got it</button></div>`,b=>{

}

const wre=w=>new RegExp(`\\b${w}\\b`,"i");
function actVocab(p,id){
  const lv=Math.min(S.lvl.vlearn||0,2),list=VOCAB[lv],pool=S.vAll?list:list.filter(x=>!S.known[x[0]]),knownN=list.filter(x=>S.known[x[0]]).length;

  const bindHead=()=>p.querySelectorAll("[data-vl]").forEach(b=>b.onclick=()=>{hush();S.lvl.vlearn=+b.dataset.vl;S.vi=0;save();actVocab(p,id)});
  if(!pool.length){p.innerHTML=head+`<div class="pic">🏆</div><div class="result">You know all the ${VLN[lv].slice(3)}!</div>
     <div class="row">${lv<2?'<button class="big go" id="vup">⬆️ Next level</button>':""}<button class="big" id="vall">🔁 Practise them all again</button></div>`;
    bindHead();confetti();mood("party");markDone(id);say("Wow! You know every word in this level!",.85);
    if(lv<2)$("#vup").onclick=()=>{S.lvl.vlearn=lv+1;S.vi=0;save();actVocab(p,id)};
    $("#vall").onclick=()=>{S.vAll=true;S.vi=0;actVocab(p,id)};return}
  S.vi=((S.vi||0)%pool.length+pool.length)%pool.length;
  const [w,em,syl,sent,mean]=pool[S.vi],parts=syl.split("-");
  p.innerHTML=head+`<div class="pic" id="pic">${em}</div><div class="word">${w}</div>
   <div class="syl">${parts.map((x,k)=>`<button class="chip" data-k="${k}">${x}</button>`).join("")}</div>
   ${mean?`<div class="meaning">💡 <b>${w}</b> means <b>${mean}</b>.</div>`:""}
   <div class="sent">${sent.replace(wre(w),m=>`<b class="hl">${m}</b>`)}</div>
   <div class="row"><button class="big go" id="hear">🔊 Hear it</button><button class="big sun" id="slow">🐢 Slowly</button><button class="big" id="did">🎤 I said it!</button></div>

   <div class="nav"><button class="round" id="prev" aria-label="Previous word">◀</button><span class="count">${S.vi+1} / ${pool.length} ${S.vAll?"· all words":"· new words"}</span><button class="mini" id="vtog">${S.vAll?"Show only new":"Show all"}</button></div>`;
  bindHead();
  const cs=[...p.querySelectorAll(".chip")];
  const go=async()=>{const pic=$("#pic");pic.classList.remove("pop");void pic.offsetWidth;pic.classList.add("pop");if(!await say(w,.72))return;if(mean&&!await say(`${w} means ${mean}.`,.78,false))return;say(sent,.78,false)};
  $("#pic").onclick=go;$("#hear").onclick=go;
  cs.forEach(c=>c.onclick=()=>{cs.forEach(x=>x.classList.toggle("on",x===c));say(c.textContent,.55)});
  $("#slow").onclick=async()=>{for(let k=0;k<parts.length;k++){cs.forEach(c=>c.classList.toggle("on",+c.dataset.k===k));if(!await say(parts[k],.5,false))return;await wait(300)}cs.forEach(c=>c.classList.remove("on"));if(await say(w,.7,false)){bubble("Now you say it!");say("Now you say it!",.85,false)}};
  $("#did").onclick=()=>{addStar();sparkle($("#did"));mood("cheer");say(praise(),.9)};
  $("#know").onclick=()=>{hush();S.known[w]=1;save();addStar();sfx.ding();sparkle($("#pic"));mood("cheer");if(S.vAll)S.vi++;bubble(`“${w}” is in your word bank!`);setTimeout(()=>actVocab(p,id),500)};
  $("#vnext").onclick=()=>{hush();S.vi++;actVocab(p,id)};
  $("#prev").onclick=()=>{hush();S.vi--;actVocab(p,id)};
  $("#vtog").onclick=()=>{S.vAll=!S.vAll;S.vi=0;actVocab(p,id)};
  go();
}

function actHSpell(p,id){

   <button class="big go pulse" id="mnext" hidden>अगला वाक्य ▶</button>

  const line=$("#line");
  const draw=()=>{line.innerHTML=built.map(j=>`<span class="tile">${tiles[j].w}</span>`).join("");p.querySelectorAll("#tiles .tile").forEach(b=>b.classList.toggle("used",built.includes(+b.dataset.j)))};
  p.querySelectorAll("#tiles .tile").forEach(b=>b.onclick=async()=>{if(solved)return;const j=+b.dataset.j;if(built.includes(j))return;built.push(j);draw();sfx.pop();say(tiles[j].w,.75,false);

        S.hmade=(S.hmade||0)+1;if(S.hmade>=5)markDone(id);$("#mnext").hidden=false;say(`${sent} ${praiseHi()}`,.8)}
      else{sfx.boing();mood("sad");say("लगभग सही! फिर से कोशिश करो।",.85);await wait(900);built=[];draw()}}});
  $("#undo").onclick=()=>{if(!solved){built.pop();draw()}};
  $("#hint").onclick=()=>say(`पहला शब्द है: ${words[0]}`,.8);
  $("#skip").onclick=()=>{hush();actHMake(p,id,(idx+1)%pool.length)};
  $("#mnext").onclick=()=>{hush();actHMake(p,id,(idx+1)%pool.length)};
  p.querySelectorAll("[data-hm]").forEach(b=>b.onclick=()=>{hush();S.lvl.hmake=+b.dataset.hm;save();actHMake(p,id,0)});
  setHelp("चित्र देखो।|शब्दों को सही क्रम में दबाओ और वाक्य बनाओ।|गलती हो तो ↩️ हटाओ दबाओ।","Hindi sentences end with a पूर्ण विराम ( । ). Read the finished sentence together.");
  hiCheck();bubble("चित्र देखो और वाक्य बनाओ!");
}

/* scrollable chip rows: visible scrollbar + ◀ ▶ buttons, selected chip kept in view */
function enhanceChips(){document.querySelectorAll(".chips:not([data-en])").forEach(c=>{c.dataset.en=1;
  const w=document.createElement("div");w.className="chipwrap";c.parentNode.insertBefore(w,c);
  const mk=(t,l)=>{const b=document.createElement("button");b.className="cnav";b.textContent=t;b.setAttribute("aria-label",l);return b};
  const L=mk("◀","Scroll left"),R=mk("▶","Scroll right");w.append(L,c,R);
  const upd=()=>{const over=c.scrollWidth>c.clientWidth+4;L.hidden=R.hidden=!over;L.disabled=c.scrollLeft<=2;R.disabled=c.scrollLeft+c.clientWidth>=c.scrollWidth-2};
  c._upd=upd;L.onclick=()=>c.scrollBy({left:-c.clientWidth*.7});R.onclick=()=>c.scrollBy({left:c.clientWidth*.7});
  c.addEventListener("scroll",upd,{passive:true});
  const sel=c.querySelector('[aria-pressed="true"]');if(sel){c.style.scrollBehavior="auto";c.scrollLeft=sel.offsetLeft-c.clientWidth/2+sel.offsetWidth/2;c.style.scrollBehavior=""}
  upd();setTimeout(upd,350)})}
new MutationObserver(enhanceChips).observe(document.body,{childList:true,subtree:true});
addEventListener("resize",()=>document.querySelectorAll(".chips").forEach(c=>c._upd&&c._upd()));
